# gate: the pull request's contract and its merge gate (CI is truth; never run locally).
# Called from the client repo's gate.yml, which listens to the edits of the body, so that
# Jamie's tick starts a run:
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, ready_for_review, reopened]
#   jobs:
#     gate:
#       uses: legible-consulting/.github/.github/workflows/gate.yml@main
# The repo's ruleset requires the check `gate / gate` on main.
#
# Both jobs are bash only and check out .icm/intake only. Both pass with no check when the repo
# has no .icm/intake/CONTEXT.md: this repo, a workspace. The body comes in through env, never
# through an expression in the script.
name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    # The body and .icm/intake/ against the intake contract. Each failure is one ::error line.
    # release-please and Dependabot open pull requests with no ticket: the job skips them.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'release-please--branches--main' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .icm/intake
      - name: contract
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: |
          in=.icm/intake
          if [ ! -f "${in}/CONTEXT.md" ]; then
            echo "No ${in}/CONTEXT.md: no contract to check."
            exit 0
          fi
          body="$(printf '%s\n' "$BODY" | tr -d '\r')"
          fail=0
          err() { echo "::error file=$1::$2"; fail=1; }
          # The value of a "- key: value" line in a stub.
          field() { sed -nE "s/^- *$2: *//p" "$1" | head -n1; }

          # 1. The ticket line resolves in one of the contract's three places.
          ticket="$(grep -m1 -E '^- ticket:' <<<"$body" || true)"
          path="$(grep -oE '\.icm/intake/[^[:space:]]+\.md' <<<"$ticket" | head -n1 || true)"
          stub=""
          if [ -z "$path" ]; then
            err "${in}/CONTEXT.md" "the body has no '- ticket:' line with the stub's path"
          elif [[ "$path" == "${in}/setup/"* ]]; then
            err "$path" "a setup stub is not a ticket"
          else
            dir="$(dirname "$path")"
            base="$(basename "$path")"
            for p in "$path" "${dir}/_done/${base}" "${in}/_done/${dir#"${in}"/}/_done/${base}"; do
              if [ -f "$p" ]; then
                stub="$p"
                break
              fi
            done
            if [ -z "$stub" ]; then
              err "$path" "the ticket line names no stub on this branch, also not in _done/"
            fi
          fi

          # 2. The gate anchors.
          if ! grep -qF '<!-- gate:ready-to-merge -->' <<<"$body"; then
            err "${stub:-${in}/CONTEXT.md}" "the body has no Ready to merge anchor"
          fi
          if [ -n "$stub" ] && [[ "$path" != "${in}/triage/"* ]]; then
            complexity="$(field "$stub" complexity | tr '[:upper:]' '[:lower:]')"
            case "$complexity" in
              medium* | high* | research*)
                if ! grep -qF '<!-- gate:spec-approved -->' <<<"$body"; then
                  err "$stub" "complexity ${complexity%% *}: the body has no Spec approved anchor"
                fi
                ;;
            esac
          fi

          # 3. The branch's stub is not open.
          slug="${BRANCH#triage/}"
          case "$slug" in
            breakdown | README | CONTEXT) ;;
            *)
              while IFS= read -r f; do
                if [ -n "$f" ]; then
                  err "$f" "the stub of branch ${BRANCH} is open. Move it into _done/ on this branch"
                fi
              done < <(find "$in" -name "${slug}.md" -not -path '*/_done/*' -not -path "${in}/setup/*")
              ;;
          esac

          # 4. Each open epic: sequence 1..m with no gap, depends-on, feature-slug.
          # A depends-on value: a slug of the same epic, <epic>/<slug>, or none.
          resolves() {
            [ -f "${in}/$1/$2.md" ] || [ -f "${in}/$1/_done/$2.md" ] || [ -f "${in}/_done/$1/_done/$2.md" ]
          }
          epics=()
          for d in "$in"/*/; do
            epic="$(basename "$d")"
            case "$epic" in triage | _done | setup) continue ;; esac
            epics+=("$epic")
            numbers=()
            total=""
            for f in "$d"*.md "$d"_done/*.md; do
              [ -f "$f" ] || continue
              name="$(basename "$f" .md)"
              if [ "$name" = breakdown ]; then
                continue
              fi
              if [ "$(field "$f" feature-slug)" != "$name" ]; then
                err "$f" "feature-slug is not the file name, ${name}"
              fi
              sequence="$(field "$f" sequence)"
              if [[ "$sequence" =~ ^([0-9]+)\ of\ ([0-9]+) ]]; then
                numbers+=("${BASH_REMATCH[1]}")
                if [ -z "$total" ]; then
                  total="${BASH_REMATCH[2]}"
                elif [ "$total" != "${BASH_REMATCH[2]}" ]; then
                  err "$f" "sequence says of ${BASH_REMATCH[2]}. Another stub of ${epic} says of ${total}"
                fi
              else
                err "$f" "no '- sequence: <n> of <m>' line"
              fi
              deps="$(field "$f" depends-on)"
              deps="${deps//[[:space:]]/}"
              deps="${deps//\`/}"
              if [ -z "$deps" ]; then
                err "$f" "no '- depends-on:' line"
                continue
              fi
              IFS=',' read -ra list <<<"$deps"
              for dep in "${list[@]}"; do
                case "$dep" in
                  none) ;;
                  */*)
                    if ! resolves "${dep%%/*}" "${dep#*/}"; then
                      err "$f" "depends-on ${dep} names no stub"
                    fi
                    ;;
                  *)
                    if ! resolves "$epic" "$dep"; then
                      err "$f" "depends-on ${dep} names no stub of ${epic}"
                    fi
                    ;;
                esac
              done
            done
            if [ -n "$total" ]; then
              have="$(printf '%s\n' "${numbers[@]}" | sort -n | tr '\n' ' ')"
              want="$(seq 1 "$total" | tr '\n' ' ')"
              if [ "$have" != "$want" ]; then
                err "${d}breakdown.md" "the sequences of ${epic} are ${have% }, not 1 to ${total}"
              fi
            fi
          done

          # 4b. Each stub in setup/ and setup/_done/: § The setup stub.
          for f in "$in"/setup/*.md "$in"/setup/_done/*.md; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .md)"
            if [ "$(field "$f" setup-slug)" != "$name" ]; then
              err "$f" "setup-slug is not the file name, ${name}"
            fi
            if [ -z "$(field "$f" needs)" ]; then
              err "$f" "no '- needs:' line"
            fi
            if [ -z "$(field "$f" where)" ]; then
              err "$f" "no '- where:' line"
            fi
            if [[ "$f" == "${in}/setup/_done/"* ]]; then
              first="$(head -n1 "$f")"
              if ! [[ "$first" =~ ^\>\ (Done|Dropped):\  ]]; then
                err "$f" "no '> Done:' or '> Dropped:' first line"
              fi
            fi
          done

          # 5. Two or more open epics: README.md § Order lists each.
          # setup/ holds setup stubs, not an epic: § Order neither counts it nor lists it
          # (why: a setup stub is not a ticket, the intake contract § The setup stub · 2026-10-29).
          ordered=()
          for epic in "${epics[@]}"; do
            [ "$epic" = setup ] || ordered+=("$epic")
          done
          if [ "${#ordered[@]}" -ge 2 ]; then
            order="$(awk '/^## Order/ { on = 1; next } /^## / { on = 0 } on' "${in}/README.md" 2>/dev/null || true)"
            for epic in "${ordered[@]}"; do
              if ! grep -qE "^[0-9]+\.[[:space:]]+\`?${epic}\`?([[:space:]]|$)" <<<"$order"; then
                err "${in}/README.md" "§ Order has no line for the open epic ${epic}"
              fi
            done
          fi

          exit "$fail"

  gate:
    # Green on Jamie's tick. Green on release-please's and Dependabot's pull requests: neither
    # carries a box, a person still merges each, and merge.sh still refuses without the tick.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .icm/intake
      - name: gate
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$GITHUB_HEAD_REF" = release-please--branches--main ]; then
            echo "The release pull request: its merge is Jamie's word, release."
            exit 0
          fi
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            echo "A Dependabot pull request: a person merges it."
            exit 0
          fi
          if [ ! -f .icm/intake/CONTEXT.md ]; then
            echo "No .icm/intake/CONTEXT.md: no gate here."
            exit 0
          fi
          body="$(printf '%s\n' "$BODY" | tr -d '\r')"
          if grep -qE '^- \[[xX]\] \*\*Ready to merge\*\*' <<<"$body"; then
            echo "Ready to merge is ticked."
            exit 0
          fi
          echo "::error::Ready to merge has no tick. The merge waits on Jamie."
          exit 1
