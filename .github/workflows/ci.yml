# ci: this repo's own checks (CI is truth; never run locally). It calls check-client.yml and
# gate.yml from the same commit, so a pull request that changes either checks itself with it.
# gate.yml finds no .icm/intake/CONTEXT.md here, so its jobs pass with no check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check-client.yml

  gate:
    uses: ./.github/workflows/gate.yml
